_target_: envs.loco_hitter.LocoHitterEnv
_recursive_: False
config:
  device: ${device}
  simulator: ${sim}
  obs: ${obs}
  control: ${robot.control}
  policy: ${mimic.policy}
  motion: ${mimic.motion}
  locomotion: ${locomotion.cmd}
  locomotion_policy_control: ${locomotion.policy_control}
  teleop: ${teleop}
  upper_dof_num: 17
  hitter_switch:
    auto_switch_on_ball: true
    switch_back_after_hitter: true
    loco_to_hitter_steps: 10
    hitter_to_loco_steps: 25
    return_after_strike_s: 0.15
    hitter_max_duration_s: 2.4
    # Match the old /home/loco1/RobotBridge g1_29dof locomotion setup.
    # The HITTER racket asset uses a deeper, softer default pose; using it for
    # the locomotion policy made the legs too soft to stand.
    locomotion_default_angles:
      [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
       -0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
       0.0, 0.0, 0.0,
       0.2, 0.2, 0.0, 0.9, 0.0, 0.0, 0.0,
       0.2, -0.2, 0.0, 0.9, 0.0, 0.0, 0.0]
    locomotion_kps:
      [100, 100, 100, 200, 20, 20,
       100, 100, 100, 200, 20, 20,
       400, 400, 400,
       90, 60, 20, 60, 20, 20, 20,
       90, 60, 20, 60, 20, 20, 20]
    locomotion_kds:
      [2.5, 2.5, 2.5, 5.0, 0.2, 0.1,
       2.5, 2.5, 2.5, 5.0, 0.2, 0.1,
       5.0, 5.0, 5.0,
       2.0, 1.0, 0.4, 1.0, 0.5, 0.5, 0.5,
       2.0, 1.0, 0.4, 1.0, 0.5, 0.5, 0.5]
  collect_dataset: false
